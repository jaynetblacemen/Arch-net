name: Build Arch-net

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Dependencies
        run: |
          sudo apt update
          sudo apt install -y autoconf2.13 build-essential ccache clang llvm \
            libgtk-3-dev libdbus-glib-1-dev libxt-dev libx11-xcb-dev \
            libxcomposite-dev libxdamage-dev libxrandr-dev \
            libasound2-dev libpulse-dev yasm nasm python3 python3-pip git \
            cargo rustc cmake ninja-build

      - name: Setup CCache
        run: |
          echo 'export CCACHE_DIR=$HOME/.ccache' >> $GITHUB_ENV
          echo 'export CCACHE_COMPRESS=1' >> $GITHUB_ENV
          echo 'export CCACHE_MAXSIZE=5G' >> $GITHUB_ENV
          ccache -z

      - name: Build Browser
        run: |
          ./mach bootstrap --no-interactive
          ./mach build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arch-net
          path: obj-*/dist/bin/
